function references(db,key,id){const found=[];function check(k,test){if((db[k]||[]).some(test))found.push(k);}if(key==='students'){check('sessions',x=>x.studentId===id);check('fees',x=>x.studentId===id);check('registrations',x=>x.studentId===id);check('events',x=>(x.studentIds||[]).includes(id));}if(key==='trainers'){check('students',x=>x.trainerId===id);check('sessions',x=>x.trainerId===id);check('events',x=>(x.trainerIds||[]).includes(id));}if(key==='courses'){check('students',x=>(x.courseIds||[]).includes(id));check('sessions',x=>x.courseId===id);check('fees',x=>x.courseId===id);}if(key==='artists')check('events',x=>(x.artistIds||[]).includes(id)||(x.expenses||[]).some(p=>p.artistId===id));return found;}
function validate(db,key,r){const errors=[];const required={students:r.importPending?['name','status']:['name','age','mobile','location','trainerId','courseIds','status','enrollmentDate'],trainers:['name','mobile','expertise','availability','commission','status'],artists:['name','mobile','expertise','availability','status'],courses:['name','category','subcategory','feeType','fee','sessions'],sessions:['studentId','trainerId','courseId','plannedDate','status'],fees:['studentId','courseId','amount','dueDate'],registrations:['studentId','amount','date','mode','receipt'],events:['name','date','duration','organizer','status']}[key]||[];
const requiredMessages={students:{name:'Enter the student name.',age:'Enter the student age.',mobile:'Enter the student mobile number.',location:'Enter the student location.',trainerId:'Select an assigned trainer.',courseIds:'Select at least one course or work packet.',status:'Select the student status.',enrollmentDate:'Select the enrolment date.'},trainers:{name:'Enter the trainer name.',mobile:'Enter the trainer mobile number.',expertise:'Enter the trainer expertise.',availability:'Enter the trainer availability.',commission:'Enter the trainer commission percentage.',status:'Select the trainer status.'},artists:{name:'Enter the artist name.',mobile:'Enter the artist mobile number.',expertise:'Enter the artist expertise.',category:'Select the artist category.',availability:'Enter the artist availability.',status:'Select the artist status.'},courses:{name:'Enter the work packet name.',category:'Select the work packet category.',subcategory:'Enter the subcategory or instrument.',feeType:'Select the pricing type.',fee:'Enter the fee amount.',sessions:'Enter the number of sessions.',status:'Select the work packet status.'},registrations:{studentId:'Select a student.',amount:'Enter the registration amount.',date:'Select the registration date.',mode:'Select the payment mode.',receipt:'Enter the registration receipt number.'},events:{name:'Enter the program or concert name.',date:'Select the event date.',duration:'Enter the event duration.',durationUnit:'Select Days, Months, or Years.',organizer:'Enter the organizer name.',status:'Select the event status.'}};

for(const k of ['age','commission','fee','sessions','amount','discount','duration','batchSize','collections','organizerCharge','organizerReceived'])if(!(key==='courses'&&k==='duration'&&!r.durationUnit)&&r[k]!==undefined&&r[k]!==''&&(!Number.isFinite(Number(r[k]))||Number(r[k])<0))errors.push(`${k} must be a valid non-negative number.`);
if(r.durationUnit&&!['Days','Months','Years'].includes(r.durationUnit))errors.push('Duration unit must be Days, Months or Years.');

if(['students','trainers','artists'].includes(key)&&r.name&&r.mobile){const digits=String(r.mobile).replace(/\D/g,'');const duplicate=(db[key]||[]).find(x=>x.id!==r.id&&String(x.name||'').trim().toLocaleLowerCase()===String(r.name).trim().toLocaleLowerCase()&&String(x.mobile||'').replace(/\D/g,'')===digits);if(duplicate)errors.push(`${key==='artists'?'An':'A'} ${key==='students'?'student':key==='trainers'?'trainer':'artist'} with this name and mobile number already exists.`);}

if(key==='events'&&r.name&&r.date&&(db.events||[]).some(x=>x.id!==r.id&&String(x.name||'').trim().toLocaleLowerCase()===String(r.name).trim().toLocaleLowerCase()&&x.date===r.date))errors.push('A concert with this name and date already exists.');

if(key==='courses'&&(r.sessions<1||!Number.isInteger(Number(r.sessions))))errors.push('Sessions must be a positive whole number.');

function normaliseDuration(k,r){if(!['courses','events'].includes(k)||r.durationUnit)return r;const text=String(r.duration??'').trim(),match=text.match(/^([0-9]+(?:\.[0-9]+)?)\s*(days?|weeks?|months?|years?|hours?)?$/i);if(!match){r.durationUnit='Days';return r;}let value=Number(match[1]),unit=(match[2]||'').toLowerCase();if(unit.startsWith('week')){value*=7;unit='days';}else if(unit.startsWith('hour')||(!unit&&k==='events')){value=Math.round(value/24*100)/100;unit='days';}r.duration=value;r.durationUnit=unit.startsWith('month')?'Months':unit.startsWith('year')?'Years':'Days';return r;}

});
document.addEventListener('change',ev=>{const el=ev.target;if(el.id==='filter-month')filters.month=el.value;else if(el.id==='filter-course')filters.course=el.value;else if(el.id==='filter-trainer')filters.trainer=el.value;else if(el.id==='filter-student-status')filters.status=el.value;else if(el.id==='status')status=el.value;else if(el.id==='directory-type'){directoryType=el.value;if(!directoryStatuses().includes(directoryStatus))directoryStatus='';}else if(el.id==='directory-status')directoryStatus=el.value;else if(el.id==='report-type')reportType=el.value;else if(el.id==='report-month')filters.month=el.value;else return;render();});
let searchTimer;document.addEventListener('input',ev=>{const id=ev.target.id;if(!['search','directory-search'].includes(id))return;if(id==='search')search=ev.target.value;else directoryQuery=ev.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{const selector=id==='search'?'#search':'#directory-search',pos=$(selector)?.selectionStart;render();$(selector)?.focus();$(selector)?.setSelectionRange(pos,pos);},220);});
document.addEventListener('submit',ev=>{const form=ev.target.closest('[data-form]');if(!form)return;ev.preventDefault();const kind=form.dataset.form,data=Object.fromEntries(new FormData(form));const error=s=>{const target=form.querySelector('.form-error')||$('#login-error');if(target){target.textContent=s;target.tabIndex=-1;target.focus();target.scrollIntoView({block:'nearest'});}};try{
if(kind==='login'){if(form.dataset.setup==='true'&&data.pin!==data.confirmPin)return error('PINs do not match.');let result;if(preview){db=M.upgrade(JSON.parse(standaloneStorage.getItem('ramashree-gurukul-standalone-v1')||'null')||M.empty());if(form.dataset.setup==='true'){db=M.empty();db.institute=data.institute;standaloneStorage.setItem('ramashree-gurukul-standalone-v1',JSON.stringify(db));}result={state:db,username:'owner',role:'Owner'};}else result=JSON.parse(form.dataset.setup==='true'?A.setup(data.institute,data.pin):A.login(data.username,data.pin));if(result.error)return error(result.error);db=M.upgrade(result.state);user={username:result.username,role:result.role,entityId:result.entityId};page='home';filters={};return render();}
if(kind==='record'){const k=form.dataset.key,id=form.dataset.id;const old=id?find(k,id):{};const record={...old,id:id||M.id()};const fields=user.role==='Artist'?schemas[k].filter(f=>['availability','stagePreference','payoutExpectation','socialLinks'].includes(f.name)):schemas[k];for(const f of fields){if(f.type.startsWith('multi:'))record[f.name]=[...form.elements[f.name].selectedOptions].map(o=>o.value);else if(f.type==='number')record[f.name]=data[f.name]===''?undefined:Number(data[f.name]);else if(f.name==='assignmentDone')record.assignmentDone=data[f.name]==='Yes';else record[f.name]=(data[f.name]||'').trim();}if(k==='students')delete record.importPending;if(['courses','events'].includes(k)&&record.duration===undefined)delete record.durationUnit;if(k==='fees')record.payments=old.payments||[];if(k==='registrations')record.status='Paid';if(k==='events')record.expenses=old.expenses||[];const errors=M.validate(db,k,record);if(errors.length)return error(errors.join('\n'));if(id)db[k]=db[k].map(r=>r.id===id?record:r);else db[k].push(record);if(persist(`${id?'Updated':'Created'} ${singular[k]}: ${record.name||nm('students',record.studentId)}`)){close();const messages={students:id?'Student updated successfully.':'Student enrolled successfully.',trainers:id?'Trainer updated successfully.':'Trainer added successfully.',artists:id?'Artist updated successfully.':'Artist added successfully.',courses:id?'Work packet updated successfully.':'Work packet added successfully.',registrations:'Student registered and payment recorded successfully.',events:id?'Concert updated successfully.':'Concert added successfully.'};toast(messages[k]||'Saved successfully.');}return;}
if(kind==='payment'){const f=find('fees',form.dataset.id),amount=Number(data.amount);if(!Number.isFinite(amount)||amount<=0||amount>M.due(f)+.001)return error('Enter an amount above zero and within the balance due.');if(db.fees.some(f=>(f.payments||[]).some(p=>p.receipt.toLowerCase()===data.receipt.trim().toLowerCase())))return error('Receipt number is already in use.');f.payments.push({id:M.id(),...data,receipt:data.receipt.trim(),amount});if(persist(`Recorded fee collection ${fmt(amount)} · receipt ${data.receipt}`)){close();toast('Payment and receipt saved.');}return;}
if(kind==='expense'){const e=find('events',form.dataset.id),amount=Number(data.amount);if(!Number.isFinite(amount)||amount<=0)return error('Enter an amount above zero.');if(data.category==='Artist payout'&&!(e.artistIds||[]).includes(data.artistId))return error('Select an artist participating in this event.');(e.expenses||=[]).push({id:M.id(),...data,artistId:data.category==='Artist payout'?data.artistId:'',amount});if(persist(`Recorded event ${data.category.toLowerCase()} ${fmt(amount)} · ${e.name}`)){close();toast('Expense saved.');}return;}
if(kind==='rename'){db.institute=data.institute.trim();if(persist('Renamed institute'))close();return;}if(kind==='account'){const r=JSON.parse(A.addAccount(data.username,data.pin,data.role,data.entityId));if(r.error)return error(r.error);return accounts();}if(kind==='pin'){if(data.newPin!==data.confirmPin)return error('New PINs do not match.');if(preview)return error('Secure PINs are available in the Android APK.');const r=JSON.parse(A.changePin(data.oldPin,data.newPin));if(r.error)return error(r.error);close();return toast('PIN updated.');}if(kind==='backup'||kind==='restore'){if(data.password.length<10)return error('Use a backup password of at least 10 characters.');if(preview)return error('Encrypted backups are available in the Android APK.');if(kind==='backup')A.backup(data.password);else A.restore(data.password);close();return;}
}catch(e){error(e.message||'The operation could not be completed.');}});
window.nativeLocked=()=>{close();showLogin();};window.nativeNotice=s=>toast(s);window.nativeRestored=()=>{close();showLogin();toast('Backup restored. Sign in with a restored account PIN.');};window.handleBack=()=>{if($('#overlay').innerHTML){close();return true;}if(page!=='home'){page='home';search='';status='';render();return true;}return false;};openStandalone();
